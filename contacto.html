<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <title>contacto</title>
    <link href="https://fonts.googleapis.com/css?family=Lato:300,400,700,900" rel="stylesheet">
    <link rel="stylesheet" href="css/normalize.css">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>

    <header class="site-header">
        <div class="contenedor contenido-header">
            <div class="barra">
                <a href="/">
                    <img src="img/meducativo.png" alt="Logotipo de Bienes Raices">
                </a>
                <div class="mobile-menu">
                    <a href="#navegacion">
                        <img src="img/barras.svg" alt="Icono Menu">
                    </a>
                </div>

                <nav id="navegacion" class="navegacion">
                    <a href="sistemas.html">Sistemas</a> 
                    <a href="programacion.html">Programación</a> 
                    <a href="Recursos educativos.html">Recursos Educativos</a>

            </div>
        </div> <!-- contenedor -->

    <p class="titulo">Contacto</p>
    <img src="img/contacto.webp" alt="Imagen Principal">

    <main class="contenedor seccion contenido-centrado">
        <p class="titulo">Llena el formulario de Contacto</p>

        <form class="contacto" action="">
            <fieldset>
                <legend>Información Personal</legend>
                <label for="nombre">Nombre:</label>
                <input type="text" id="nombre" placeholder="Tu Nombre">

                <label for="email">E-mail: </label>
                <input type="email" id="email" placeholder="Tu Correo electrónico" required>

                <label for="telefono">Teléfono:</label>
                <input type="tel" id="telefono" placeholder="Tu Teléfono" required>

                <label for="mensaje">Mensaje: </label>
                <textarea  id="mensaje"></textarea>

            </fieldset>
            <input type="submit" value="Enviar" class="boton boton-verde">

        </form>
    </main>

    <footer class="site-footer seccion">
        <div class="contenedor contenedor-footer">
            <nav class="navegacion">
                 <a href="sistemas.html">Sistemas</a>

        </div>
